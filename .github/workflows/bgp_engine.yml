name: BGP Path Proof Engine

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch: # Allows manual triggers from GitHub Actions tab

concurrency:
  group: bgp-path-proof-engine
  cancel-in-progress: false

jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the bot can commit and push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run BGP Engine
        run: |
          python bgp_engine.py

      - name: Commit and push changes
        run: |
          git config --global user.name "bgp-bot[bot]"
          git config --global user.email "bgp-bot[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bgp): record AS path proofs and route anomalies [skip ci]" && git push)
